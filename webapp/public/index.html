<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>就職活動 進捗票</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Job Hunt Progress</p>
        <h1>就職活動 進捗票</h1>
      </div>
      <button class="ghost-button" id="loginToggle" type="button">管理者ログイン</button>
    </header>

    <main class="layout">
      <section class="summary-band" aria-label="応募状況サマリー">
        <div class="summary-item">
          <span class="summary-value" id="totalCount">0</span>
          <span class="summary-label">応募社数</span>
        </div>
        <div class="summary-item">
          <span class="summary-value" id="activeCount">0</span>
          <span class="summary-label">進行中</span>
        </div>
        <div class="summary-item">
          <span class="summary-value" id="offerCount">0</span>
          <span class="summary-label">内定</span>
        </div>
      </section>

      <section class="auth-panel hidden" id="authPanel" aria-label="ログイン">
        <form id="loginForm" class="login-form">
          <label>
            ユーザー名
            <input name="username" autocomplete="username" required />
          </label>
          <label>
            パスワード
            <input name="password" type="password" autocomplete="current-password" required />
          </label>
          <button class="primary-button" type="submit">ログイン</button>
          <p class="form-message" id="loginMessage"></p>
        </form>
      </section>

      <section class="admin-panel hidden" id="adminPanel" aria-label="会社登録">
        <div class="section-heading">
          <h2>会社を追加</h2>
          <button class="ghost-button" id="logoutButton" type="button">ログアウト</button>
        </div>
        <form id="companyForm" class="company-form">
          <label>
            会社名
            <input name="name" placeholder="例: 株式会社サンプル" required />
          </label>
          <label>
            選考状況
            <select name="status" id="statusSelect"></select>
          </label>
          <label>
            志望度
            <select name="desireLevel" id="desireLevelSelect"></select>
          </label>
          <label class="wide-field">
            会社URL
            <input name="url" placeholder="example.com/recruit" />
          </label>
          <label class="wide-field">
            メモ
            <textarea name="memo" rows="3" placeholder="次回面接日、準備事項など"></textarea>
          </label>
          <button class="primary-button" type="submit">追加する</button>
        </form>
      </section>

      <section class="todo-section" aria-label="やることリスト">
        <div class="section-heading">
          <h2>やることリスト</h2>
        </div>
        <form id="todoForm" class="todo-form hidden">
          <label>
            やること
            <input name="title" placeholder="例: 志望動機を見直す" required />
          </label>
          <label>
            期限
            <input name="dueDate" type="date" />
          </label>
          <button class="primary-button" type="submit">追加する</button>
        </form>
        <div class="todo-list" id="todoList"></div>
      </section>

      <section class="progress-section" aria-label="進捗票">
        <div class="section-heading">
          <h2>選考状況</h2>
          <div class="tabs" id="statusTabs" role="tablist"></div>
        </div>
        <div class="company-grid" id="companyGrid"></div>
      </section>
    </main>

    <template id="companyTemplate">
      <article class="company-card">
        <div class="company-header">
          <div>
            <div class="pill-row">
              <span class="status-pill"></span>
              <span class="desire-pill"></span>
            </div>
            <h3></h3>
          </div>
          <div class="admin-actions hidden">
            <button class="icon-button edit-button" type="button" title="編集">編集</button>
            <button class="icon-button delete-button" type="button" title="削除">削除</button>
          </div>
        </div>
        <p class="memo"></p>
        <div class="edit-area hidden">
          <label>
            会社名
            <input class="edit-name" />
          </label>
          <label>
            選考状況
            <select class="edit-status"></select>
          </label>
          <label>
            志望度
            <select class="edit-desire-level"></select>
          </label>
          <label>
            会社URL
            <input class="edit-url" placeholder="example.com/recruit" />
          </label>
          <label>
            メモ
            <textarea class="edit-memo" rows="3"></textarea>
          </label>
          <div class="row-actions">
            <button class="primary-button save-button" type="button">保存</button>
            <button class="ghost-button cancel-button" type="button">キャンセル</button>
          </div>
        </div>
      </article>
    </template>

    <section class="layout free-comment-section" aria-label="フリーコメント">
      <div class="section-heading">
        <h2>フリーコメント</h2>
      </div>
      <form class="comment-form" id="freeCommentForm">
        <input name="author" placeholder="お名前（任意）" />
        <textarea name="body" rows="3" placeholder="自由にコメントを入力" required></textarea>
        <button class="secondary-button" type="submit">コメント追加</button>
      </form>
      <div class="comment-list" id="freeCommentList"></div>
    </section>

    <script src="/app.js"></script>
  </body>
</html>
